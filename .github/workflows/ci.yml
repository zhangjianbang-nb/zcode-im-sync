name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protoc（飞书 WS SDK 构建依赖）
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: hook syntax
        run: node --check tui/zcode-tui-im-sync.cjs
      - name: hook unit tests
        run: node --test tui/test/tui-hook.test.cjs
      - name: scripts syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/selftest.sh
