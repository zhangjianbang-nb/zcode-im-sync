[package]
name = "im-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "zcode-im-sync：微信/飞书 ↔ zcode TUI 全过程消息同步（iLink Bot API / 飞书长连接）"
license = "MIT"

[lib]
name = "im_bridge"
path = "src/lib.rs"

[[bin]]
name = "im-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
    "io-std",
    "fs",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
larksuite-oapi-sdk-rs = { version = "=0.3.13", features = ["channel"] }
qrcode = { version = "0.14", default-features = false }
png = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
libc = "0.2"
aes = "0.8"
ecb = "0.1"
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
